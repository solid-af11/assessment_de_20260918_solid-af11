version: 2

models:
  - name: fct_city_daily
    description: >
      One row per (city, weather_date), business-friendly daily weather
      aggregates ready for reporting.
    columns:
      - name: city
        description: City name.
        data_tests:
          - not_null
      - name: weather_date
        description: The date this reading is for.
        data_tests:
          - not_null
      - name: temp_max_c
        description: Max daily temperature in Celsius, rounded to 1 decimal.
      - name: temp_min_c
        description: Min daily temperature in Celsius, rounded to 1 decimal.
      - name: temp_mean_c
        description: Mean daily temperature in Celsius, rounded to 1 decimal.
      - name: temp_range_c
        description: Difference between max and min temperature for the day.
      - name: precipitation_mm
        description: Total daily precipitation in millimetres.
      - name: windspeed_max_kmh
        description: Max daily windspeed in km/h.
      - name: had_precipitation
        description: True if any precipitation was recorded on this day.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - city
            - weather_date
